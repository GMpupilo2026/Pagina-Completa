<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.svg">
    <title>Sin conexión — Ajedrez Integral</title>
    <meta name="description" content="No hay conexión a internet en este momento.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#102a43">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
</head>
<body class="font-sans bg-brand-50 text-brand-800 dark:bg-brand-950 dark:text-brand-100">
    <main id="main-content" class="min-h-[calc(100vh-1rem)] flex items-center justify-center px-4 py-10">
        <div class="max-w-md w-full bg-white dark:bg-brand-900 rounded-2xl shadow-md p-8 text-center">
            <img src="img/app/icon-192.png" alt="" width="72" height="72" class="mx-auto mb-5 rounded-2xl">
            <h1 class="font-serif text-2xl font-bold text-brand-800 dark:text-white mb-2">Te quedaste sin internet</h1>
            <p class="text-brand-500 dark:text-brand-300 mb-6">
                No se pudo cargar esta parte de la Academia. En cuanto vuelva la señal, todo sigue donde lo dejaste:
                tu avance se guarda en el aparato y sube solo al reconectarse.
            </p>
            <button type="button" id="reintentar" class="bg-accent-500 hover:bg-accent-600 text-brand-900 font-semibold px-5 py-2.5 rounded-lg text-sm transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent-400">
                Volver a intentar
            </button>
            <p id="estado" class="text-xs text-brand-450 dark:text-brand-350 mt-5" role="status" aria-live="polite">
                Revisa los datos o el wifi.
            </p>
        </div>
    </main>
    <script>
        /* El botón no adivina: pregunta al navegador si ya hay red y solo
           entonces recarga. Recargar sin señal deja la misma pantalla y parece
           que el botón no sirve. */
        var estado = document.getElementById("estado");
        function intentar() {
            if (navigator.onLine) { location.reload(); return; }
            estado.textContent = "Todavía no hay señal. Revisa los datos o el wifi.";
        }
        document.getElementById("reintentar").addEventListener("click", intentar);
        window.addEventListener("online", function () {
            estado.textContent = "Volvió la señal. Cargando…";
            location.reload();
        });
    </script>
</body>
</html>
