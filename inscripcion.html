<script>
    const WORKER_URL = 'https://ajedrez-inscripciones.gmpupilo.workers.dev';
    const correoInput = document.getElementById('correo');
    const mepErrorMsg = document.getElementById('mep-error');
    const fechaNacimientoInput = document.getElementById('fechaNacimiento');
    const ageErrorMsg = document.getElementById('age-error');

    // Función para verificar correos del MEP
    function esCorreoMEP(email) {
        return email.trim().toLowerCase().endsWith('@mep.go.cr');
    }

    // Función para calcular la edad exacta a partir de la fecha de nacimiento
    function calcularEdad(fechaNacimientoStr) {
        if (!fechaNacimientoStr) return null;
        const hoy = new Date();
        const nacimiento = new Date(fechaNacimientoStr);
        let edad = hoy.getFullYear() - nacimiento.getFullYear();
        const mes = hoy.getMonth() - nacimiento.getMonth();
        
        if (mes < 0 || (mes === 0 && hoy.getDate() < nacimiento.getDate())) {
            edad--;
        }
        return edad;
    }

    // Validación de edad: entre 11 y 19 años
    function esEdadValida(fechaNacimientoStr) {
        const edad = calcularEdad(fechaNacimientoStr);
        if (edad === null || isNaN(edad)) return false;
        return edad >= 11 && edad <= 19;
    }

    // Validación en tiempo real del correo
    correoInput.addEventListener('input', function() {
        if (esCorreoMEP(this.value)) {
            this.classList.add('border-red-500', 'bg-red-50/50');
            this.classList.remove('border-brand-200', 'bg-brand-50/30');
            mepErrorMsg.classList.remove('hidden');
            this.setCustomValidity('No se permiten correos institucionales del MEP (@mep.go.cr).');
        } else {
            this.classList.remove('border-red-500', 'bg-red-50/50');
            this.classList.add('border-brand-200', 'bg-brand-50/30');
            mepErrorMsg.classList.add('hidden');
            this.setCustomValidity('');
        }
    });

    // Validación en tiempo real de la fecha de nacimiento
    fechaNacimientoInput.addEventListener('input', function() {
        if (this.value && !esEdadValida(this.value)) {
            this.classList.add('border-red-500', 'bg-red-50/50');
            this.classList.remove('border-brand-200', 'bg-white/90');
            ageErrorMsg.classList.remove('hidden');
            this.setCustomValidity('La persona inscrita debe tener entre 11 y 19 años cumplidos.');
        } else {
            this.classList.remove('border-red-500', 'bg-red-50/50');
            this.classList.add('border-brand-200', 'bg-white/90');
            ageErrorMsg.classList.add('hidden');
            this.setCustomValidity('');
        }
    });

    // Proceso de envío del formulario
    document.getElementById('inscription-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (esCorreoMEP(correoInput.value)) {
            mepErrorMsg.classList.remove('hidden');
            correoInput.focus();
            return;
        }

        if (!esEdadValida(fechaNacimientoInput.value)) {
            ageErrorMsg.classList.remove('hidden');
            fechaNacimientoInput.focus();
            return;
        }

        const formData = new FormData(this);
        const data = Object.fromEntries(formData);
        
        // CÁLCULO Y ADICIÓN DE EDAD PARA EL WORKER:
        data.edad = calcularEdad(data.fechaNacimiento);

        const submitBtn = this.querySelector('button[type="submit"]');
        const successMsg = document.getElementById('form-success');
        const errorMsg = document.getElementById('form-error');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando…';

        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                successMsg.classList.remove('hidden');
                errorMsg.classList.add('hidden');
                this.reset();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                const err = await res.json().catch(() => ({}));
                errorMsg.textContent = '⚠️ ' + (err.error || 'No se pudo enviar la inscripción');
                errorMsg.classList.remove('hidden');
                successMsg.classList.add('hidden');
            }
        } catch (err) {
            errorMsg.textContent = '⚠️ Error de conexión con el servidor.';
            errorMsg.classList.remove('hidden');
            successMsg.classList.add('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Enviar inscripción';
        }
    });
</script>
