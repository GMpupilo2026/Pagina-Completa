<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción — Ajedrez Integral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff', 100: '#e0f0fe', 200: '#bae0fd', 300: '#7cc5fb',
                            400: '#36a3f7', 500: '#0c87eb', 600: '#0067ca', 700: '#0352a3',
                            800: '#074482', 900: '#0b396b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-brand-50 text-brand-900 min-h-screen">
    
    <header class="fixed top-0 left-0 right-0 z-50 bg-brand-800/95 backdrop-blur-md shadow-md">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 md:h-20">
                <a href="index.html" class="flex items-center gap-2 text-white">
                    <span class="text-3xl">♟️</span>
                    <span class="font-serif text-xl md:text-2xl font-bold">Ajedrez <span class="text-brand-200">Integral</span></span>
                </a>
            </div>
        </nav>
    </header>

    <section class="pt-28 py-16">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="text-center mb-10">
                <span class="text-brand-600 font-semibold uppercase tracking-wide text-sm bg-brand-100 px-3 py-1 rounded-full">Formulario oficial</span>
                <h1 class="font-serif text-3xl md:text-4xl font-bold text-brand-800 mt-3">Inscripción de Estudiantes</h1>
                <p class="text-brand-700/80 mt-2">Ingrese su número de cédula para autocompletar sus datos.</p>
            </div>

            <form id="inscription-form" class="bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl p-6 md:p-10 space-y-6 border border-brand-100">
                
                <div>
                    <label for="cedula" class="block text-sm font-semibold text-brand-800 mb-1">Número de Cédula <span class="text-blue-500">*</span></label>
                    <div class="flex gap-2">
                        <input type="text" id="cedula" name="cedula" required placeholder="Ej. 101230456" class="w-full px-4 py-3 rounded-lg border border-brand-200 focus:ring-2 focus:ring-brand-400 bg-brand-50/30">
                        <button type="button" id="btn-consultar" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-5 rounded-lg transition whitespace-nowrap shadow">Consultar</button>
                    </div>
                    <p class="text-xs text-brand-600 mt-1">Presione consultar para rellenar automáticamente sus datos.</p>
                </div>

                <div>
                    <label for="nombre" class="block text-sm font-semibold text-brand-800 mb-1">Nombre <span class="text-blue-500">*</span></label>
                    <input type="text" id="nombre" name="nombre" required class="w-full px-4 py-3 rounded-lg border border-brand-200 bg-brand-50/30">
                </div>

                <div class="grid sm:grid-cols-2 gap-6">
                    <div>
                        <label for="apellido1" class="block text-sm font-semibold text-brand-800 mb-1">Primer Apellido <span class="text-blue-500">*</span></label>
                        <input type="text" id="apellido1" name="apellido1" required class="w-full px-4 py-3 rounded-lg border border-brand-200 bg-brand-50/30">
                    </div>
                    <div>
                        <label for="apellido2" class="block text-sm font-semibold text-brand-800 mb-1">Segundo Apellido <span class="text-blue-500">*</span></label>
                        <input type="text" id="apellido2" name="apellido2" required class="w-full px-4 py-3 rounded-lg border border-brand-200 bg-brand-50/30">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-brand-800 mb-2">Sexo <span class="text-blue-500">*</span></label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center gap-3 px-4 py-3 rounded-lg border border-brand-200 cursor-pointer bg-white/60 hover:bg-brand-50">
                            <input type="radio" name="sexo" value="Masculino" required class="w-4 h-4 text-brand-600">
                            <span class="font-medium text-brand-800">Masculino</span>
                        </label>
                        <label class="flex items-center gap-3 px-4 py-3 rounded-lg border border-brand-200 cursor-pointer bg-white/60 hover:bg-brand-50">
                            <input type="radio" name="sexo" value="Femenino" class="w-4 h-4 text-brand-600">
                            <span class="font-medium text-brand-800">Femenino</span>
                        </label>
                    </div>
                </div>

                <div class="grid sm:grid-cols-2 gap-6">
                    <div>
                        <label for="correo" class="block text-sm font-semibold text-brand-800 mb-1">Correo electrónico <span class="text-blue-500">*</span></label>
                        <input type="email" id="correo" name="correo" required placeholder="correo@gmail.com" class="w-full px-4 py-3 rounded-lg border border-brand-200 bg-brand-50/30">
                        <p id="mep-error" class="hidden text-xs text-red-600 font-semibold mt-1">⚠️ No se permiten correos @mep.go.cr</p>
                    </div>
                    <div>
                        <label for="contacto" class="block text-sm font-semibold text-brand-800 mb-1">Teléfono <span class="text-blue-500">*</span></label>
                        <input type="tel" id="contacto" name="contacto" required placeholder="8888 8888" class="w-full px-4 py-3 rounded-lg border border-brand-200 bg-brand-50/30">
                    </div>
                </div>

                <div class="grid sm:grid-cols-2 gap-6">
                    <div>
                        <label for="provincia" class="block text-sm font-semibold text-brand-800 mb-1">Provincia <span class="text-blue-500">*</span></label>
                        <select id="provincia" name="provincia" required class="w-full px-4 py-3 rounded-lg border border-brand-200 bg-white">
                            <option value="">Selecciona…</option>
                            <option value="San José">San José</option>
                            <option value="Alajuela">Alajuela</option>
                            <option value="Cartago">Cartago</option>
                            <option value="Heredia">Heredia</option>
                            <option value="Guanacaste">Guanacaste</option>
                            <option value="Puntarenas">Puntarenas</option>
                            <option value="Limón">Limón</option>
                        </select>
                    </div>
                    <div>
                        <label for="centro" class="block text-sm font-semibold text-brand-800 mb-1">Centro Educativo <span class="text-blue-500">*</span></label>
                        <input type="text" id="centro" name="centro" required class="w-full px-4 py-3 rounded-lg border border-brand-200 bg-brand-50/30">
                    </div>
                </div>

                <div class="grid sm:grid-cols-2 gap-6">
                    <div>
                        <label for="fechaNacimiento" class="block text-sm font-semibold text-brand-800 mb-1">Fecha de nacimiento <span class="text-blue-500">*</span></label>
                        <input type="date" id="fechaNacimiento" name="fechaNacimiento" required class="w-full px-4 py-3 rounded-lg border border-brand-200 bg-white">
                        <p id="age-error" class="hidden text-xs text-red-600 font-semibold mt-1">⚠️ Debe tener entre 11 y 19 años.</p>
                    </div>
                    <div>
                        <label for="grado" class="block text-sm font-semibold text-brand-800 mb-1">Grado Académico <span class="text-blue-500">*</span></label>
                        <select id="grado" name="grado" required class="w-full px-4 py-3 rounded-lg border border-brand-200 bg-white">
                            <option value="">Selecciona tu nivel…</option>
                            <option value="7mo Año">Séptimo Año (7.º)</option>
                            <option value="8vo Año">Octavo Año (8.º)</option>
                            <option value="9no Año">Noveno Año (9.º)</option>
                            <option value="10mo Año">Décimo Año (10.º)</option>
                            <option value="11mo Año">Undécimo Año (11.º)</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-4 rounded-xl text-lg transition shadow-lg">Enviar inscripción</button>
                </div>

                <div id="form-success" class="hidden bg-blue-50 border border-blue-200 text-brand-800 rounded-lg p-4 text-center font-medium">
                    ✅ ¡Inscripción enviada con éxito!
                </div>
                <div id="form-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg p-4 text-center font-medium"></div>
            </form>
        </div>
    </section>

    <script>
        // URL real de tu Cloudflare Worker existente
        const API_BASE_URL = 'https://ajedrez-inscripciones.gmpupilo.workers.dev';
        
        const cedulaInput = document.getElementById('cedula');
        const btnConsultar = document.getElementById('btn-consultar');
        const nombreInput = document.getElementById('nombre');
        const apellido1Input = document.getElementById('apellido1');
        const apellido2Input = document.getElementById('apellido2');
        const fechaNacimientoInput = document.getElementById('fechaNacimiento');
        const correoInput = document.getElementById('correo');
        const mepErrorMsg = document.getElementById('mep-error');
        const ageErrorMsg = document.getElementById('age-error');

        async function consultarCedula() {
            const cedula = cedulaInput.value.trim();
            if (cedula.length < 9) {
                alert('Ingrese un número de cédula válido.');
                return;
            }

            btnConsultar.textContent = 'Buscando...';
            btnConsultar.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/api/consultar-cedula/${cedula}`);
                if (response.ok) {
                    const data = await response.json();
                    nombreInput.value = data.nombre || '';
                    apellido1Input.value = data.apellido1 || '';
                    apellido2Input.value = data.apellido2 || '';
                    fechaNacimientoInput.value = data.fechaNacimiento || '';
                    
                    if (data.sexo) {
                        const radio = document.querySelector(`input[name="sexo"][value="${data.sexo}"]`);
                        if (radio) radio.checked = true;
                    }
                } else {
                    alert('Cédula no encontrada en los registros.');
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                alert('No se pudo conectar con el servidor.');
            } finally {
                btnConsultar.textContent = 'Consultar';
                btnConsultar.disabled = false;
            }
        }

        btnConsultar.addEventListener('click', consultarCedula);
        cedulaInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); consultarCedula(); } });

        function esCorreoMEP(email) { return email.trim().toLowerCase().endsWith('@mep.go.cr'); }
        
        function calcularEdad(fechaStr) {
            if (!fechaStr) return null;
            const hoy = new Date();
            const nacimiento = new Date(fechaStr);
            let edad = hoy.getFullYear() - nacimiento.getFullYear();
            const mes = hoy.getMonth() - nacimiento.getMonth();
            if (mes < 0 || (mes === 0 && hoy.getDate() < nacimiento.getDate())) edad--;
            return edad;
        }

        correoInput.addEventListener('input', function() {
            if (esCorreoMEP(this.value)) {
                mepErrorMsg.classList.remove('hidden');
                this.setCustomValidity('No se permite correo MEP');
            } else {
                mepErrorMsg.classList.add('hidden');
                this.setCustomValidity('');
            }
        });

        document.getElementById('inscription-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const edad = calcularEdad(fechaNacimientoInput.value);
            if (edad === null || edad < 11 || edad > 19) {
                ageErrorMsg.classList.remove('hidden');
                fechaNacimientoInput.focus();
                return;
            } else {
                ageErrorMsg.classList.add('hidden');
            }

            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            const submitBtn = this.querySelector('button[type="submit"]');
            const successMsg = document.getElementById('form-success');
            const errorMsg = document.getElementById('form-error');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';

            try {
                const res = await fetch(`${API_BASE_URL}/api/inscripciones`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    successMsg.classList.remove('hidden');
                    errorMsg.classList.add('hidden');
                    this.reset();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    errorMsg.textContent = '⚠️ Error al procesar la inscripción.';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = '⚠️ Error de red con el servidor.';
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar inscripción';
            }
        });
    </script>
</body>
</html>
