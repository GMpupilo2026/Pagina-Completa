<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscripción - Ajedrez Integral</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #f5f1e8;
        }

        input,
        select,
        textarea {
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        input.border-error,
        select.border-error,
        textarea.border-error {
            border-color: #dc2626;
            background-color: #fef2f2;
        }
    </style>
</head>

<body class="min-h-screen py-8 px-4">

    <main class="max-w-3xl mx-auto">

        <section class="bg-white rounded-2xl shadow-xl overflow-hidden">

            <div class="bg-slate-800 text-white px-6 py-8 text-center">
                <h1 class="text-3xl font-bold">
                    Ajedrez Integral
                </h1>

                <p class="mt-2 text-slate-200">
                    Formulario de inscripción
                </p>
            </div>

            <form
                id="inscription-form"
                class="p-6 md:p-8 space-y-6"
                novalidate
            >

                <!-- Consulta de cédula -->
                <div>
                    <label
                        for="cedula"
                        class="block text-sm font-semibold text-slate-700 mb-2"
                    >
                        Número de cédula
                        <span class="text-red-600">*</span>
                    </label>

                    <div class="flex flex-col sm:flex-row gap-2">
                        <input
                            type="text"
                            id="cedula"
                            name="cedula"
                            required
                            inputmode="numeric"
                            autocomplete="off"
                            maxlength="12"
                            placeholder="Ejemplo: 101230456"
                            class="w-full rounded-lg border border-slate-300 px-4 py-3"
                        >

                        <button
                            type="button"
                            id="btn-buscar-cedula"
                            class="rounded-lg bg-blue-700 px-5 py-3 font-semibold text-white transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-60"
                        >
                            Buscar
                        </button>
                    </div>

                    <p
                        id="cedula-error"
                        class="mt-2 hidden text-sm font-semibold text-red-600"
                    ></p>

                    <p
                        id="cedula-success"
                        class="mt-2 hidden text-sm font-semibold text-green-600"
                    ></p>
                </div>

                <!-- Datos personales -->
                <div class="border-t border-slate-200 pt-6">
                    <h2 class="mb-4 text-xl font-bold text-slate-800">
                        Datos personales
                    </h2>

                    <div class="grid gap-5 md:grid-cols-2">

                        <div>
                            <label
                                for="nombre"
                                class="mb-2 block text-sm font-semibold text-slate-700"
                            >
                                Nombre
                                <span class="text-red-600">*</span>
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                required
                                autocomplete="given-name"
                                class="w-full rounded-lg border border-slate-300 px-4 py-3"
                            >
                        </div>

                        <div>
                            <label
                                for="primer_apellido"
                                class="mb-2 block text-sm font-semibold text-slate-700"
                            >
                                Primer apellido
                                <span class="text-red-600">*</span>
                            </label>

                            <input
                                type="text"
                                id="primer_apellido"
                                name="primer_apellido"
                                required
                                autocomplete="family-name"
                                class="w-full rounded-lg border border-slate-300 px-4 py-3"
                            >
                        </div>

                        <div>
                            <label
                                for="segundo_apellido"
                                class="mb-2 block text-sm font-semibold text-slate-700"
                            >
                                Segundo apellido
                            </label>

                            <input
                                type="text"
                                id="segundo_apellido"
                                name="segundo_apellido"
                                autocomplete="family-name"
                                class="w-full rounded-lg border border-slate-300 px-4 py-3"
                            >
                        </div>

                        <div>
                            <label
                                for="fecha_nacimiento"
                                class="mb-2 block text-sm font-semibold text-slate-700"
                            >
                                Fecha de nacimiento
                                <span class="text-red-600">*</span>
                            </label>

                            <input
                                type="date"
                                id="fecha_nacimiento"
                                name="fecha_nacimiento"
                                required
                                class="w-full rounded-lg border border-slate-300 px-4 py-3"
                            >

                            <p
                                id="age-error"
                                class="mt-2 hidden text-sm font-semibold text-red-600"
                            >
                                La persona debe tener entre 11 y 19 años.
                            </p>
                        </div>

                    </div>
                </div>

                <!-- Datos de contacto -->
                <div class="border-t border-slate-200 pt-6">
                    <h2 class="mb-4 text-xl font-bold text-slate-800">
                        Datos de contacto
                    </h2>

                    <div class="grid gap-5 md:grid-cols-2">

                        <div>
                            <label
                                for="correo"
                                class="mb-2 block text-sm font-semibold text-slate-700"
                            >
                                Correo electrónico
                                <span class="text-red-600">*</span>
                            </label>

                            <input
                                type="email"
                                id="correo"
                                name="correo"
                                required
                                autocomplete="email"
                                placeholder="ejemplo@correo.com"
                                class="w-full rounded-lg border border-slate-300 px-4 py-3"
                            >

                            <p
                                id="mep-error"
                                class="mt-2 hidden text-sm font-semibold text-red-600"
                            >
                                No se permiten correos terminados en @mep.go.cr.
                            </p>
                        </div>

                        <div>
                            <label
                                for="telefono"
                                class="mb-2 block text-sm font-semibold text-slate-700"
                            >
                                Teléfono
                                <span class="text-red-600">*</span>
                            </label>

                            <input
                                type="tel"
                                id="telefono"
                                name="telefono"
                                required
                                autocomplete="tel"
                                placeholder="8888-8888"
                                class="w-full rounded-lg border border-slate-300 px-4 py-3"
                            >
                        </div>

                    </div>
                </div>

                <!-- Información adicional -->
                <div class="border-t border-slate-200 pt-6">
                    <label
                        for="observaciones"
                        class="mb-2 block text-sm font-semibold text-slate-700"
                    >
                        Observaciones
                    </label>

                    <textarea
                        id="observaciones"
                        name="observaciones"
                        rows="4"
                        placeholder="Información adicional, experiencia previa, necesidades especiales, etc."
                        class="w-full rounded-lg border border-slate-300 px-4 py-3"
                    ></textarea>
                </div>

                <!-- Mensajes -->
                <div
                    id="form-success"
                    class="hidden rounded-lg border border-green-300 bg-green-50 p-4 text-green-800"
                >
                    La inscripción fue enviada correctamente.
                </div>

                <div
                    id="form-error"
                    class="hidden rounded-lg border border-red-300 bg-red-50 p-4 text-red-800"
                ></div>

                <!-- Botón -->
                <button
                    type="submit"
                    id="submit-button"
                    class="w-full rounded-lg bg-slate-800 px-5 py-4 font-bold text-white transition hover:bg-slate-900 disabled:cursor-not-allowed disabled:opacity-60"
                >
                    Enviar inscripción
                </button>

            </form>
        </section>
    </main>

    <script>
        /*
         * Cambia esta URL por la URL real de tu Cloudflare Worker.
         */
        const WORKER_URL =
            'https://TU-WORKER.workers.dev';

        const form =
            document.getElementById('inscription-form');

        const cedulaInput =
            document.getElementById('cedula');

        const buscarCedulaButton =
            document.getElementById('btn-buscar-cedula');

        const cedulaError =
            document.getElementById('cedula-error');

        const cedulaSuccess =
            document.getElementById('cedula-success');

        const nombreInput =
            document.getElementById('nombre');

        const primerApellidoInput =
            document.getElementById('primer_apellido');

        const segundoApellidoInput =
            document.getElementById('segundo_apellido');

        const fechaNacimientoInput =
            document.getElementById('fecha_nacimiento');

        const correoInput =
            document.getElementById('correo');

        const ageError =
            document.getElementById('age-error');

        const mepError =
            document.getElementById('mep-error');

        const formSuccess =
            document.getElementById('form-success');

        const formError =
            document.getElementById('form-error');

        const submitButton =
            document.getElementById('submit-button');


        function limpiarCedula(valor) {
            return valor.replace(/\D/g, '');
        }


        function mostrarErrorCedula(mensaje) {
            cedulaError.textContent = '⚠️ ' + mensaje;
            cedulaError.classList.remove('hidden');
            cedulaSuccess.classList.add('hidden');
        }


        function mostrarExitoCedula(mensaje) {
            cedulaSuccess.textContent = '✅ ' + mensaje;
            cedulaSuccess.classList.remove('hidden');
            cedulaError.classList.add('hidden');
        }


        function convertirFecha(fecha) {
            if (!fecha) {
                return '';
            }

            fecha = String(fecha).trim();

            /*
             * YYYY-MM-DD
             */
            if (/^\d{4}-\d{2}-\d{2}$/.test(fecha)) {
                return fecha;
            }

            /*
             * DD/MM/YYYY
             */
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(fecha)) {
                const partes = fecha.split('/');

                const dia = partes[0];
                const mes = partes[1];
                const año = partes[2];

                return `${año}-${mes}-${dia}`;
            }

            /*
             * DD-MM-YYYY
             */
            if (/^\d{2}-\d{2}-\d{4}$/.test(fecha)) {
                const partes = fecha.split('-');

                const dia = partes[0];
                const mes = partes[1];
                const año = partes[2];

                return `${año}-${mes}-${dia}`;
            }

            /*
             * Fecha ISO con hora.
             */
            if (fecha.includes('T')) {
                return fecha.substring(0, 10);
            }

            return '';
        }


        function calcularEdad(fecha) {
            if (!fecha) {
                return null;
            }

            const hoy = new Date();
            const nacimiento = new Date(fecha + 'T00:00:00');

            if (Number.isNaN(nacimiento.getTime())) {
                return null;
            }

            let edad =
                hoy.getFullYear() -
                nacimiento.getFullYear();

            const diferenciaMes =
                hoy.getMonth() -
                nacimiento.getMonth();

            if (
                diferenciaMes < 0 ||
                (
                    diferenciaMes === 0 &&
                    hoy.getDate() < nacimiento.getDate()
                )
            ) {
                edad--;
            }

            return edad;
        }


        function validarEdad() {
            const edad =
                calcularEdad(fechaNacimientoInput.value);

            const esValida =
                edad !== null &&
                edad >= 11 &&
                edad <= 19;

            if (!esValida) {
                fechaNacimientoInput.classList.add('border-error');
                ageError.classList.remove('hidden');
                fechaNacimientoInput.setCustomValidity(
                    'La edad debe estar entre 11 y 19 años.'
                );

                return false;
            }

            fechaNacimientoInput.classList.remove('border-error');
            ageError.classList.add('hidden');
            fechaNacimientoInput.setCustomValidity('');

            return true;
        }


        async function buscarDatosCedula() {
            const cedula =
                limpiarCedula(cedulaInput.value);

            cedulaInput.value = cedula;

            cedulaError.classList.add('hidden');
            cedulaSuccess.classList.add('hidden');

            if (!cedula) {
                mostrarErrorCedula(
                    'Ingresa un número de cédula.'
                );

                cedulaInput.focus();
                return;
            }

            if (cedula.length < 9) {
                mostrarErrorCedula(
                    'La cédula debe contener al menos 9 dígitos.'
                );

                cedulaInput.focus();
                return;
            }

            buscarCedulaButton.disabled = true;
            buscarCedulaButton.textContent = 'Buscando...';

            try {
                const url =
                    `${WORKER_URL}/api/consulta-cedula?cedula=${encodeURIComponent(cedula)}`;

                const response =
                    await fetch(url, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });

                const data =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        'No fue posible consultar la cédula.'
                    );
                }

                const hayDatos =
                    data.nombre ||
                    data.primer_apellido ||
                    data.segundo_apellido ||
                    data.fecha_nacimiento;

                if (!hayDatos) {
                    mostrarErrorCedula(
                        'No se encontraron datos. Puedes completar el formulario manualmente.'
                    );

                    return;
                }

                nombreInput.value =
                    data.nombre || '';

                primerApellidoInput.value =
                    data.primer_apellido || '';

                segundoApellidoInput.value =
                    data.segundo_apellido || '';

                fechaNacimientoInput.value =
                    convertirFecha(data.fecha_nacimiento);

                validarEdad();

                mostrarExitoCedula(
                    'Datos encontrados y completados automáticamente.'
                );

            } catch (error) {
                console.error(error);

                mostrarErrorCedula(
                    error.message ||
                    'Ocurrió un error consultando la cédula.'
                );

            } finally {
                buscarCedulaButton.disabled = false;
                buscarCedulaButton.textContent = 'Buscar';
            }
        }


        buscarCedulaButton.addEventListener(
            'click',
            buscarDatosCedula
        );


        cedulaInput.addEventListener(
            'keydown',
            function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    buscarDatosCedula();
                }
            }
        );


        cedulaInput.addEventListener(
            'input',
            function() {
                this.value = limpiarCedula(this.value);
            }
        );


        fechaNacimientoInput.addEventListener(
            'input',
            validarEdad
        );


        correoInput.addEventListener(
            'input',
            function() {
                const correo =
                    this.value.trim().toLowerCase();

                const esCorreoMEP =
                    correo.endsWith('@mep.go.cr');

                if (esCorreoMEP) {
                    this.classList.add('border-error');
                    mepError.classList.remove('hidden');
                    this.setCustomValidity(
                        'No se permiten correos @mep.go.cr.'
                    );
                } else {
                    this.classList.remove('border-error');
                    mepError.classList.add('hidden');
                    this.setCustomValidity('');
                }
            }
        );


        form.addEventListener(
            'submit',
            async function(event) {
                event.preventDefault();

                formSuccess.classList.add('hidden');
                formError.classList.add('hidden');

                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                if (!validarEdad()) {
                    fechaNacimientoInput.focus();
                    return;
                }

                const correo =
                    correoInput.value.trim().toLowerCase();

                if (correo.endsWith('@mep.go.cr')) {
                    mepError.classList.remove('hidden');
                    correoInput.focus();
                    return;
                }

                const datos =
                    Object.fromEntries(
                        new FormData(form).entries()
                    );

                submitButton.disabled = true;
                submitButton.textContent = 'Enviando...';

                try {
                    const response =
                        await fetch(
                            `${WORKER_URL}/api/inscripciones`,
                            {
                                method: 'POST',
                                headers: {
                                    'Content-Type':
                                        'application/json',

                                    'Accept':
                                        'application/json'
                                },
                                body: JSON.stringify(datos)
                            }
                        );

                    const resultado =
                        await response.json();

                    if (!response.ok) {
                        throw new Error(
                            resultado.error ||
                            'No se pudo enviar la inscripción.'
                        );
                    }

                    formSuccess.classList.remove('hidden');
                    form.reset();

                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });

                } catch (error) {
                    console.error(error);

                    formError.textContent =
                        '⚠️ ' +
                        (
                            error.message ||
                            'Ocurrió un error enviando el formulario.'
                        );

                    formError.classList.remove('hidden');

                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent =
                        'Enviar inscripción';
                }
            }
        );
    </script>

</body>
</html>
