<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.svg">
    <title>Certificado de curso</title>
    <meta name="description" content="Certificado de un curso de Ajedrez Integral, con su código para comprobar que es auténtico.">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- oscuro: inicio --><script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');}catch(e){}})();</script><!-- oscuro: fin -->
    <script src="js/adaptive-mode.js"></script>
<!-- app: inicio --><meta name="theme-color" content="#102a43"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ajedrez"><script src="js/errores.js"></script><script src="js/pwa.js" defer></script><!-- app: fin --><!-- fuentes: inicio --><link rel="stylesheet" href="css/fuentes.css"><!-- fuentes: fin --><!-- tema: inicio --><script>(function(){try{var l=localStorage.getItem('plataforma_letra_v1');if(l&&/^[a-z]{2,24}$/.test(l)&&l!=='tema')document.documentElement.setAttribute('data-letra',l);var t=localStorage.getItem('plataforma_tema_v1');if(!t||!/^[a-z]{2,24}$/.test(t)||t==='clasico')return;document.documentElement.setAttribute('data-tema',t);var b=getComputedStyle(document.documentElement).getPropertyValue('--c-brand-800').trim();var m=document.querySelector('meta[name="theme-color"]');if(b&&m)m.setAttribute('content','rgb('+b.replace(/\s+/g,',')+')');}catch(e){}})();</script><!-- tema: fin --></head>
<body class="font-sans bg-brand-50 text-brand-800 dark:bg-brand-950 dark:text-brand-100 transition-colors duration-300">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:bg-accent-500 focus:text-brand-900 focus:font-semibold focus:px-4 focus:py-2 focus:rounded-lg">Saltar al contenido principal</a>
    <!-- El certificado de un curso (js/certificado.js). Página pública: la abre
         quien recibe el enlace o escanea el QR, sin cuenta. Lo que dice sale de
         certificado_publico(código) y nada más. Sin encabezado del sitio: es un
         papel. Ver «Los certificados de curso» en docs/decisiones/cursos-y-material.md. -->
    <main id="main-content" class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
        <p id="estado" role="status" class="no-imprimir text-brand-600 dark:text-brand-300">Buscando el certificado…</p>

        <div id="app" hidden>
            <!-- Lo que dice la página sobre el papel: si vale. No se imprime. -->
            <div id="validez" class="no-imprimir mb-4 rounded-xl border-2 p-4" role="status">
                <p id="validez-texto" class="font-semibold"></p>
                <p id="validez-detalle" class="text-sm mt-1"></p>
            </div>
            <div class="no-imprimir flex flex-wrap items-center gap-2 mb-6">
                <button type="button" id="imprimir" class="bg-brand-800 hover:bg-brand-900 dark:bg-brand-700 dark:hover:bg-brand-600 text-white font-semibold px-4 py-2 rounded-lg text-sm transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent-400"><span aria-hidden="true">🖨️ </span>Imprimir o guardar en PDF</button>
                <button type="button" id="copiar" class="border border-brand-300 dark:border-brand-600 text-brand-800 dark:text-white font-semibold px-4 py-2 rounded-lg text-sm hover:bg-white dark:hover:bg-brand-800 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent-400"><span aria-hidden="true">🔗 </span>Copiar el enlace</button>
                <p id="copiar-msg" class="text-sm text-brand-600 dark:text-brand-300" role="status" aria-live="polite"></p>
            </div>

            <!-- El papel. Siempre claro, como un papel de verdad, también en modo oscuro. -->
            <article id="certificado" aria-labelledby="cert-titulo" class="certificado relative bg-white text-brand-800 rounded-2xl shadow-lg overflow-hidden">
                <div class="certificado-marco">
                    <header class="flex items-center justify-between gap-4">
                        <img id="logo-academia" alt="" class="certificado-logo" hidden>
                        <!-- La marca de Ajedrez Integral, igual que en el encabezado del sitio:
                             el caballo y el nombre sobre el azul (el caballo es claro y sobre
                             el papel blanco no se vería). -->
                        <div class="certificado-marca ml-auto flex items-center gap-2 bg-brand-800 text-white rounded-xl">
                            <img src="img/logo-marca.png" alt="" width="155" height="96" class="certificado-marca-img">
                            <span class="font-serif font-bold tracking-tight">Ajedrez <span class="text-accent-400">Integral</span></span>
                        </div>
                    </header>
                    <div class="text-center mt-2">
                        <p class="uppercase tracking-[0.25em] text-sm font-semibold text-brand-600">Certificado de curso</p>
                        <h1 id="cert-titulo" class="font-serif text-3xl sm:text-4xl font-bold mt-1">Se certifica que</h1>
                        <p id="cert-alumno" class="font-serif text-3xl sm:text-5xl font-bold mt-4 text-brand-900 certificado-nombre"></p>
                        <p class="mt-4 text-lg">completó todas las lecciones del curso</p>
                        <p id="cert-curso" class="font-serif text-2xl sm:text-3xl font-bold mt-2"></p>
                        <p id="cert-lecciones" class="mt-2 text-brand-600"></p>
                    </div>
                    <div class="mt-8 flex flex-wrap items-end justify-between gap-6">
                        <dl class="text-sm space-y-1">
                            <div><dt class="inline font-semibold">Fecha: </dt><dd id="cert-fecha" class="inline"></dd></div>
                            <div><dt class="inline font-semibold">Profesor o profesora: </dt><dd id="cert-profesor" class="inline"></dd></div>
                            <div id="cert-academia-fila" hidden><dt class="inline font-semibold">Academia: </dt><dd id="cert-academia" class="inline"></dd></div>
                        </dl>
                        <div class="text-center">
                            <div id="cert-qr" class="certificado-qr mx-auto"></div>
                            <p class="text-xs text-brand-600 mt-1">Para comprobarlo: <span id="cert-codigo" class="font-mono font-semibold"></span></p>
                        </div>
                    </div>
                </div>
                <p id="cert-anulado" class="certificado-anulado" hidden aria-hidden="true">ANULADO</p>
            </article>
        </div>
    </main>

    <script src="js/vendor/supabase.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/main.js"></script>
    <script src="js/vendor/qrcode.js"></script>
    <script src="js/certificado.js"></script>
</body>
</html>
