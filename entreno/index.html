<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entreno — Ajedrez Integral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1b140f;
    --bg-panel:#251c15;
    --bg-panel-2:#2f251b;
    --line:#3c3024;
    --text:#efe3d1;
    --text-muted:#a4907a;
    --brass:#b8935a;
    --brass-bright:#dcb679;
    --facil:#75935a;
    --intermedio:#c9a23e;
    --avanzado:#9c4148;
    --especialista:#436a86;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    background-image:
      radial-gradient(ellipse at top, rgba(184,147,90,0.07), transparent 60%);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  ::selection{background:var(--brass); color:#1b140f;}

  /* ---------- GATE ---------- */
  #gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate-box{
    width:100%;
    max-width:360px;
    text-align:center;
  }
  .gate-mark{
    width:44px;height:44px;margin:0 auto 22px;
    border:1.5px solid var(--brass);
    transform:rotate(45deg);
    position:relative;
  }
  .gate-mark::after{
    content:"";
    position:absolute; inset:6px;
    border:1px solid var(--line);
  }
  .gate-box h1{
    font-size:2.1rem;
    letter-spacing:0.01em;
    color:var(--text);
  }
  .gate-box p{
    color:var(--text-muted);
    font-size:0.95rem;
    margin:10px 0 32px;
    line-height:1.5;
  }
  #pw-form{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  #pw-input{
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--line);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    font-size:1.05rem;
    padding:10px 4px;
    text-align:center;
    letter-spacing:0.04em;
    outline:none;
    transition:border-color .2s;
  }
  #pw-input:focus{border-bottom-color:var(--brass);}
  #pw-submit{
    background:var(--brass);
    color:#1b140f;
    border:none;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    padding:12px 20px;
    cursor:pointer;
    letter-spacing:0.02em;
    transition:background .2s;
  }
  #pw-submit:hover{background:var(--brass-bright);}
  #pw-error{
    color:var(--avanzado);
    font-size:0.85rem;
    min-height:1.2em;
    margin-top:-4px;
  }

  /* ---------- APP ---------- */
  #app{display:none;}
  header.top{
    padding:28px 24px 0;
    max-width:1180px;
    margin:0 auto;
  }
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px 20px;
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
  }
  header.top h1{font-size:1.7rem;}
  .count{
    color:var(--text-muted);
    font-size:0.9rem;
  }
  .count strong{color:var(--text); font-weight:600;}

  nav.tabs{
    display:flex;
    gap:6px;
    max-width:1180px;
    margin:0 auto;
    padding:18px 24px 0;
    flex-wrap:wrap;
  }
  .tab{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-bottom:3px solid var(--tab-color, var(--line));
    color:var(--text-muted);
    font-family:'Work Sans', sans-serif;
    font-size:0.88rem;
    font-weight:500;
    padding:10px 16px;
    cursor:pointer;
    transition:background .2s, color .2s;
  }
  .tab:hover{color:var(--text);}
  .tab.active{
    background:var(--bg-panel-2);
    color:var(--text);
  }
  .tab .n{color:var(--text-muted); font-size:0.8em;}

  main{
    max-width:1180px;
    margin:0 auto;
    padding:22px 24px 60px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(130px,1fr));
    gap:12px;
  }
  .card{
    position:relative;
    aspect-ratio:1/1;
    background:var(--bg-panel);
    border:1px solid var(--line);
    cursor:pointer;
    overflow:hidden;
    transition:border-color .15s;
  }
  .card:hover{border-color:var(--brass);}
  .card img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .card .badge{
    position:absolute;
    top:0; left:0;
    background:rgba(27,20,15,0.82);
    color:var(--text);
    font-size:0.72rem;
    font-weight:600;
    padding:3px 7px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }

  footer{
    text-align:center;
    color:var(--text-muted);
    font-size:0.8rem;
    padding:20px 24px 40px;
  }

  /* ---------- LIGHTBOX ---------- */
  #lightbox{
    display:none;
    position:fixed; inset:0;
    background:rgba(10,7,5,0.92);
    z-index:50;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:20px;
  }
  #lightbox.open{display:flex;}
  #lb-img{
    max-width:min(86vw, 520px);
    max-height:60vh;
    border:1px solid var(--line);
  }
  #lb-caption{
    margin-top:16px;
    font-family:'Fraunces', serif;
    font-size:1.2rem;
    color:var(--text);
  }
  .lb-nav{
    display:flex;
    align-items:center;
    gap:28px;
    margin-top:18px;
  }
  .lb-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    width:40px; height:40px;
    font-size:1.1rem;
    cursor:pointer;
    transition:border-color .2s;
  }
  .lb-btn:hover{border-color:var(--brass);}
  #lb-close{
    position:absolute;
    top:20px; right:24px;
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:1.6rem;
    cursor:pointer;
    line-height:1;
  }
  #lb-close:hover{color:var(--text);}

  @media (max-width:520px){
    .grid{grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px;}
    header.top h1{font-size:1.4rem;}
  }

  /* ---------- LOCK BADGE ---------- */
  .card.locked{cursor:not-allowed;}
  .card.locked img{filter:grayscale(1) brightness(0.4);}
  .card .solved-badge{
    position:absolute; top:0; right:0;
    background:rgba(117,147,90,0.92);
    color:#1b140f;
    font-size:0.85rem;
    font-weight:700;
    padding:3px 7px;
    border-left:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .card .lock-icon{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:1.6rem;
    color:var(--text-muted);
    background:rgba(10,7,5,0.35);
  }

  /* ---------- BOARD MODAL (Solo Chess jugable) ---------- */
  #board-modal{
    display:none;
    position:fixed; inset:0;
    background:rgba(10,7,5,0.94);
    z-index:60;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  #board-modal.open{display:flex;}
  .board-wrap{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  .board-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
    color:var(--text-muted);
    font-size:0.85rem;
  }
  .board-head strong{color:var(--text); font-family:'Fraunces',serif; font-size:1.15rem; font-weight:600;}
  #board-close{
    position:absolute; top:20px; right:24px;
    background:none; border:none;
    color:var(--text-muted); font-size:1.6rem;
    cursor:pointer; line-height:1;
  }
  #board-close:hover{color:var(--text);}

  .board-pos-wrap{position:relative;}
  .board4{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    width:100%;
    aspect-ratio:1/1;
    border:2px solid var(--brass);
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  .sq{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    font-size:min(9vw,42px);
    cursor:pointer;
    user-select:none;
    color:var(--brass-bright);
    transition:background .12s;
  }
  .sq.light{background:#c9b190;}
  .sq.dark{background:#5a4531;}
  .sq .piece{
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    pointer-events:none;
    transition:transform .12s;
  }
  .sq.selected{box-shadow:inset 0 0 0 3px var(--brass-bright);}
  .sq.selected .piece{transform:scale(1.12);}
  .sq.target::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle, rgba(220,182,121,0.55) 0 22%, transparent 24%);
  }
  .sq.target-capture::after{
    content:"";
    position:absolute; inset:6%;
    border:3px solid rgba(220,182,121,0.85);
    border-radius:50%;
  }

  .board-status{
    margin-top:14px;
    color:var(--text-muted);
    font-size:0.9rem;
    min-height:1.3em;
  }
  .board-controls{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .bctrl{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    font-family:'Work Sans',sans-serif;
    font-size:0.85rem;
    padding:9px 16px;
    cursor:pointer;
    transition:border-color .2s;
  }
  .bctrl:hover{border-color:var(--brass);}
  .bctrl:disabled{opacity:0.35; cursor:not-allowed;}

  #win-overlay{
    display:none;
    position:absolute; inset:0;
    background:rgba(27,20,15,0.94);
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
  }
  #win-overlay.open{display:flex;}
  #win-overlay .win-title{
    color:var(--facil);
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:0.03em;
    margin-bottom:6px;
  }
  #win-overlay .win-sub{
    font-family:'Fraunces',serif;
    font-size:1.1rem;
    color:var(--text);
    margin-bottom:22px;
  }
</style>
</head>
<body>

<!-- ===== PASSWORD GATE ===== -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-mark"></div>
    <h1>Entreno</h1>
    <p>Ejercicios de ajedrez en solitario.<br>Introduce la contraseña para entrar.</p>
    <form id="pw-form">
      <input type="password" id="pw-input" placeholder="Contraseña" autocomplete="current-password" autofocus>
      <div id="pw-error"></div>
      <button type="submit" id="pw-submit">Entrar</button>
    </form>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app">
  <header class="top">
    <div class="top-row">
      <h1>Entreno</h1>
      <div class="count"><strong id="visible-count">0</strong> ejercicios</div>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>Ajedrez Integral — archivo de ejercicios de ajedrez en solitario</footer>
</div>

<!-- ===== LIGHTBOX ===== -->
<div id="lightbox">
  <button id="lb-close" aria-label="Cerrar">&times;</button>
  <img id="lb-img" src="" alt="">
  <div id="lb-caption"></div>
  <div class="lb-nav">
    <button class="lb-btn" id="lb-prev" aria-label="Anterior">&#8249;</button>
    <button class="lb-btn" id="lb-next" aria-label="Siguiente">&#8250;</button>
  </div>
</div>

<!-- ===== TABLERO JUGABLE (Solo Chess) ===== -->
<div id="board-modal">
  <button id="board-close" aria-label="Cerrar">&times;</button>
  <div class="board-wrap">
    <div class="board-head">
      <span id="board-cat"></span>
      <strong id="board-title"></strong>
      <span id="board-piece-count"></span>
    </div>
    <div class="board-pos-wrap">
      <div class="board4" id="board4"></div>
      <div id="win-overlay">
        <div class="win-title">¡MUY BIEN!</div>
        <div class="win-sub">Nivel completado</div>
        <div class="board-controls">
          <button class="bctrl" id="win-retry">Reintentar</button>
          <button class="bctrl" id="win-next">Siguiente &#8250;</button>
        </div>
      </div>
    </div>
    <div class="board-status" id="board-status">Mueve una pieza para capturar otra. Gana al dejar 1 sola pieza.</div>
    <div class="board-controls">
      <button class="bctrl" id="board-prev-puzzle">&#8249; Anterior</button>
      <button class="bctrl" id="board-reset">Reiniciar</button>
      <button class="bctrl" id="board-next-puzzle">Siguiente &#8250;</button>
    </div>
  </div>
</div>

<script>
/* ---------------- PASSWORD GATE ----------------
   Nota: esto es una barrera del lado del cliente, pensada para
   evitar el acceso casual, no una autenticación segura real.
   Cualquiera con acceso al código fuente podría eludirla.
*/
const PW_HASH = "03ece971d7c332feeb7171ea3f30c16e96fc7e0f2610b334c64b16f99407cab0";

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

const gate = document.getElementById('gate');
const app = document.getElementById('app');
const pwForm = document.getElementById('pw-form');
const pwInput = document.getElementById('pw-input');
const pwError = document.getElementById('pw-error');

function unlock(){
  gate.style.display = 'none';
  app.style.display = 'block';
  sessionStorage.setItem('entreno_unlocked','1');
  initApp();
}

pwForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const hash = await sha256(pwInput.value.trim());
  if(hash === PW_HASH){
    unlock();
  } else {
    pwError.textContent = 'Contraseña incorrecta.';
    pwInput.value = '';
    pwInput.focus();
  }
});

/* ---------------- APP ---------------- */
let EXERCISES = [];
let PUZZLES = {facil:[], intermedio:[], avanzado:[], especialista:[]};
let currentCategory = 'FACIL';
let currentList = [];
let currentIndex = 0;

const CATEGORY_ORDER = ['FACIL','INTERMEDIO','AVANZADO','ESPECIALISTA'];
const CATEGORY_LABEL = {FACIL:'Fácil', INTERMEDIO:'Intermedio', AVANZADO:'Avanzado', ESPECIALISTA:'Especialista'};
const CATEGORY_VAR = {FACIL:'--facil', INTERMEDIO:'--intermedio', AVANZADO:'--avanzado', ESPECIALISTA:'--especialista'};
const CATEGORY_KEY = {FACIL:'facil', INTERMEDIO:'intermedio', AVANZADO:'avanzado', ESPECIALISTA:'especialista'};

let appInitialized = false;

async function initApp(){
  if(appInitialized) return;
  appInitialized = true;
  const [res, res2] = await Promise.all([
    fetch('data/exercises.json'),
    fetch('data/puzzles.json').catch(() => null)
  ]);
  EXERCISES = await res.json();
  if(res2 && res2.ok){
    try{ PUZZLES = await res2.json(); }catch(e){}
  }
  buildTabs();
  showCategory('FACIL');
}

/* ---------------- PROGRESO (localStorage) ----------------
   Un ejercicio #N de una categoría con tablero jugable solo se puede
   abrir si el #N-1 de esa misma categoría ya fue resuelto (el #1
   siempre está disponible). El progreso se guarda en localStorage
   para que persista entre visitas. */
function getSolvedSet(){
  try{
    return JSON.parse(localStorage.getItem('entreno_solved') || '{}');
  }catch(e){ return {}; }
}
function markSolved(puzzleId){
  const solved = getSolvedSet();
  solved[puzzleId] = true;
  localStorage.setItem('entreno_solved', JSON.stringify(solved));
}
function isSolved(puzzleId){
  return !!getSolvedSet()[puzzleId];
}
function puzzleForExercise(ex){
  const list = PUZZLES[CATEGORY_KEY[ex.category]] || [];
  return list.find(p => p.number === ex.number) || null;
}
function isUnlocked(ex, list){
  const puz = puzzleForExercise(ex);
  if(!puz) return true; /* sin datos jugables: no aplica bloqueo, se ve como imagen */
  if(ex.number <= 1) return true;
  const prevEx = list.find(e => e.number === ex.number - 1);
  if(!prevEx) return true;
  const prevPuz = puzzleForExercise(prevEx);
  if(!prevPuz) return true;
  return isSolved(prevPuz.id);
}

function buildTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  CATEGORY_ORDER.forEach(cat => {
    const count = EXERCISES.filter(e => e.category === cat).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (cat === currentCategory ? ' active' : '');
    btn.style.setProperty('--tab-color', `var(${CATEGORY_VAR[cat]})`);
    btn.innerHTML = `${CATEGORY_LABEL[cat]} <span class="n">${count}</span>`;
    btn.addEventListener('click', () => showCategory(cat));
    tabs.appendChild(btn);
  });
}

function showCategory(cat){
  currentCategory = cat;
  document.querySelectorAll('.tab').forEach((btn,i) => {
    btn.classList.toggle('active', CATEGORY_ORDER[i] === cat);
  });
  currentList = EXERCISES.filter(e => e.category === cat).sort((a,b) => a.number - b.number);
  document.getElementById('visible-count').textContent = currentList.length;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  currentList.forEach((ex, idx) => {
    const puz = puzzleForExercise(ex);
    const solved = puz ? isSolved(puz.id) : false;
    const unlocked = isUnlocked(ex, currentList);
    const card = document.createElement('div');
    card.className = 'card' + (puz && !unlocked ? ' locked' : '');
    let extra = '';
    if(puz && solved) extra = '<span class="solved-badge">&#10003;</span>';
    else if(puz && !unlocked) extra = '<span class="lock-icon">&#128274;</span>';
    card.innerHTML = `<span class="badge">#${ex.number}</span>${extra}<img src="${ex.image}" loading="lazy" alt="${ex.categoryLabel} ${ex.number}">`;
    card.addEventListener('click', () => {
      if(puz){
        if(!unlocked){
          flashLockedMessage(ex);
          return;
        }
        openBoard(idx);
      } else {
        openLightbox(idx);
      }
    });
    grid.appendChild(card);
  });
}

function flashLockedMessage(ex){
  const grid = document.getElementById('grid');
  let msg = document.getElementById('lock-msg');
  if(!msg){
    msg = document.createElement('div');
    msg.id = 'lock-msg';
    msg.style.cssText = 'color:var(--text-muted);font-size:0.85rem;margin-top:10px;';
    grid.parentNode.insertBefore(msg, grid.nextSibling);
  }
  msg.textContent = `Resuelve el ejercicio #${ex.number - 1} para desbloquear el #${ex.number}.`;
  clearTimeout(flashLockedMessage._t);
  flashLockedMessage._t = setTimeout(() => { if(msg) msg.textContent = ''; }, 3200);
}

/* ---------------- LIGHTBOX ---------------- */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbCaption = document.getElementById('lb-caption');

function openLightbox(idx){
  currentIndex = idx;
  renderLightbox();
  lightbox.classList.add('open');
}
function renderLightbox(){
  const ex = currentList[currentIndex];
  lbImg.src = ex.image;
  lbImg.alt = `${ex.categoryLabel} ${ex.number}`;
  lbCaption.textContent = `${ex.categoryLabel} · #${ex.number}`;
}
function closeLightbox(){ lightbox.classList.remove('open'); }
document.getElementById('lb-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
document.getElementById('lb-prev').addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
  renderLightbox();
});
document.getElementById('lb-next').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % currentList.length;
  renderLightbox();
});
document.addEventListener('keydown', (e) => {
  if(!lightbox.classList.contains('open')) return;
  if(e.key === 'ArrowLeft') document.getElementById('lb-prev').click();
  if(e.key === 'ArrowRight') document.getElementById('lb-next').click();
  if(e.key === 'Escape') closeLightbox();
});

/* ---------------- SOLO CHESS: motor de juego ----------------
   Reglas (confirmadas en el video de referencia "Solo Chess"):
   - Las piezas se mueven como en ajedrez normal.
   - Todo movimiento DEBE ser una captura (no hay movimientos "libres").
   - No existe la regla de jaque.
   - Se gana al quedar con una sola pieza sobre el tablero (la última atacante). */
const PIECE_GLYPH = {P:'&#9823;', N:'&#9822;', B:'&#9821;', R:'&#9820;', Q:'&#9819;', K:'&#9818;'};
const DIRS_ROOK = [[-1,0],[1,0],[0,-1],[0,1]];
const DIRS_BISHOP = [[-1,-1],[-1,1],[1,-1],[1,1]];
const DIRS_QUEEN = DIRS_ROOK.concat(DIRS_BISHOP);
const KNIGHT_DELTAS = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];

function boardKey(r,c){ return r + ',' + c; }

function slideTargets(r,c,dirs,board){
  const out = [];
  dirs.forEach(([dr,dc]) => {
    let nr=r+dr, nc=c+dc;
    while(nr>=0 && nr<4 && nc>=0 && nc<4){
      if(board[boardKey(nr,nc)]){ out.push([nr,nc]); break; }
      nr+=dr; nc+=dc;
    }
  });
  return out;
}

function captureTargets(piece, r, c, board){
  switch(piece){
    case 'N':
      return KNIGHT_DELTAS.map(([dr,dc]) => [r+dr,c+dc])
        .filter(([nr,nc]) => nr>=0&&nr<4&&nc>=0&&nc<4&&board[boardKey(nr,nc)]);
    case 'B': return slideTargets(r,c,DIRS_BISHOP,board);
    case 'R': return slideTargets(r,c,DIRS_ROOK,board);
    case 'Q': return slideTargets(r,c,DIRS_QUEEN,board);
    case 'K':
      return DIRS_QUEEN.map(([dr,dc]) => [r+dr,c+dc])
        .filter(([nr,nc]) => nr>=0&&nr<4&&nc>=0&&nc<4&&board[boardKey(nr,nc)]);
    case 'P':
      return DIRS_BISHOP.map(([dr,dc]) => [r+dr,c+dc])
        .filter(([nr,nc]) => nr>=0&&nr<4&&nc>=0&&nc<4&&board[boardKey(nr,nc)]);
    default: return [];
  }
}

let boardState = {};       // {"r,c": pieceType}
let selectedCell = null;   // [r,c] | null
let boardCategory = null;  // 'FACIL' etc.
let boardExList = [];      // lista de ejercicios de la categoría actual
let boardExIndex = 0;      // índice dentro de boardExList
let moveHistory = [];

function loadPuzzleAt(exIndex){
  selectedCell = null;
  moveHistory = [];
  document.getElementById('win-overlay').classList.remove('open');
  boardExIndex = exIndex;
  const ex = boardExList[exIndex];
  const puz = puzzleForExercise(ex);
  boardState = {};
  puz.pieces.forEach(p => { boardState[boardKey(p.row,p.col)] = p.type; });
  document.getElementById('board-cat').textContent = ex.categoryLabel;
  document.getElementById('board-title').textContent = `#${ex.number}`;
  updatePieceCount();
  setStatus('Mueve una pieza para capturar otra. Gana al dejar 1 sola pieza.');
  renderBoard();
  updatePuzzleNavButtons();
}

function updatePieceCount(){
  const n = Object.keys(boardState).length;
  document.getElementById('board-piece-count').textContent = `${n} piezas`;
}

function setStatus(text){ document.getElementById('board-status').textContent = text; }

function renderBoard(){
  const el = document.getElementById('board4');
  el.innerHTML = '';
  let legalTargets = [];
  if(selectedCell){
    const [sr,sc] = selectedCell;
    legalTargets = captureTargets(boardState[boardKey(sr,sc)], sr, sc, boardState);
  }
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const sq = document.createElement('div');
      const light = (r+c) % 2 === 0;
      sq.className = 'sq ' + (light ? 'light' : 'dark');
      const piece = boardState[boardKey(r,c)];
      if(piece){
        sq.innerHTML = `<span class="piece">${PIECE_GLYPH[piece]}</span>`;
      }
      if(selectedCell && selectedCell[0]===r && selectedCell[1]===c){
        sq.classList.add('selected');
      }
      if(legalTargets.some(([tr,tc]) => tr===r && tc===c)){
        sq.classList.add('target-capture');
      }
      sq.addEventListener('click', () => onSquareClick(r,c));
      el.appendChild(sq);
    }
  }
}

function onSquareClick(r,c){
  const key = boardKey(r,c);
  const piece = boardState[key];
  if(selectedCell){
    const [sr,sc] = selectedCell;
    if(sr===r && sc===c){ selectedCell = null; renderBoard(); return; }
    const legal = captureTargets(boardState[boardKey(sr,sc)], sr, sc, boardState);
    if(legal.some(([tr,tc]) => tr===r && tc===c)){
      moveHistory.push(JSON.parse(JSON.stringify(boardState)));
      const movingPiece = boardState[boardKey(sr,sc)];
      delete boardState[boardKey(sr,sc)];
      boardState[key] = movingPiece;
      selectedCell = null;
      updatePieceCount();
      renderBoard();
      checkWin();
      return;
    }
    if(piece){ selectedCell = [r,c]; renderBoard(); return; }
    selectedCell = null; renderBoard();
    return;
  }
  if(piece){ selectedCell = [r,c]; renderBoard(); }
}

function checkWin(){
  const remaining = Object.keys(boardState).length;
  if(remaining <= 1){
    const ex = boardExList[boardExIndex];
    const puz = puzzleForExercise(ex);
    markSolved(puz.id);
    setStatus('¡Resuelto!');
    document.getElementById('win-overlay').classList.add('open');
    updatePuzzleNavButtons();
    return;
  }
  const anyMove = Object.keys(boardState).some(k => {
    const [r,c] = k.split(',').map(Number);
    return captureTargets(boardState[k], r, c, boardState).length > 0;
  });
  if(!anyMove){
    setStatus('No quedan capturas posibles. Pulsa "Reiniciar" para intentarlo de nuevo.');
  }
}

function updatePuzzleNavButtons(){
  const prevBtn = document.getElementById('board-prev-puzzle');
  const nextBtn = document.getElementById('board-next-puzzle');
  const winNextBtn = document.getElementById('win-next');
  prevBtn.disabled = boardExIndex <= 0;
  const ex = boardExList[boardExIndex];
  const puz = puzzleForExercise(ex);
  const solvedNow = puz && isSolved(puz.id);
  const hasNext = boardExIndex < boardExList.length - 1;
  nextBtn.disabled = !hasNext || !solvedNow;
  winNextBtn.disabled = !hasNext;
}

function openBoard(idx){
  boardCategory = currentCategory;
  boardExList = currentList;
  loadPuzzleAt(idx);
  document.getElementById('board-modal').classList.add('open');
}
function closeBoard(){
  document.getElementById('board-modal').classList.remove('open');
  showCategory(currentCategory); /* refresca badges de bloqueo/resuelto en la grilla */
}
document.getElementById('board-close').addEventListener('click', closeBoard);
document.getElementById('board-modal').addEventListener('click', (e) => {
  if(e.target.id === 'board-modal') closeBoard();
});
document.getElementById('board-reset').addEventListener('click', () => loadPuzzleAt(boardExIndex));
document.getElementById('win-retry').addEventListener('click', () => loadPuzzleAt(boardExIndex));
document.getElementById('board-prev-puzzle').addEventListener('click', () => {
  if(boardExIndex > 0) loadPuzzleAt(boardExIndex - 1);
});
document.getElementById('board-next-puzzle').addEventListener('click', () => {
  if(boardExIndex < boardExList.length - 1) loadPuzzleAt(boardExIndex + 1);
});
document.getElementById('win-next').addEventListener('click', () => {
  if(boardExIndex < boardExList.length - 1) loadPuzzleAt(boardExIndex + 1);
});
document.addEventListener('keydown', (e) => {
  if(!document.getElementById('board-modal').classList.contains('open')) return;
  if(e.key === 'Escape') closeBoard();
});

/* Se comprueba el desbloqueo previo (sessionStorage) hasta el final del script,
   ya que unlock()/initApp() dependen de variables (como appInitialized) que
   solo existen una vez que el resto del script ya se ejecutó. */
if(sessionStorage.getItem('entreno_unlocked') === '1'){
  unlock();
}
</script>
