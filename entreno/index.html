<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenamiento — Ajedrez Integral</title>
<meta name="description" content="Entrenamiento: ejercicios tácticos 4×4 y lecciones interactivas para aprender a jugar.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231b140f'/%3E%3Crect x='18' y='18' width='28' height='28' fill='none' stroke='%23b8935a' stroke-width='3' transform='rotate(45 32 32)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1b140f;
    --bg-panel:#251c15;
    --bg-panel-2:#2f251b;
    --line:#3c3024;
    --text:#efe3d1;
    --text-muted:#a4907a;
    --brass:#b8935a;
    --brass-bright:#dcb679;
    --bad:#c15a52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    background-image:radial-gradient(ellipse at top, rgba(184,147,90,0.07), transparent 60%);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    min-height:100dvh;
  }
  h1,h2{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  a{color:var(--brass-bright);}
  *:focus-visible{outline:3px solid var(--brass-bright); outline-offset:2px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  /* ---------- GATE (misma contraseña y sessionStorage que 4x4.html / aprender.html) ---------- */
  #gate{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-box{width:100%; max-width:360px; text-align:center;}
  .gate-mark{width:52px; height:52px; margin:0 auto 18px; border:3px solid var(--brass); transform:rotate(45deg);}
  .gate-box h1{font-size:1.8rem; margin-bottom:10px;}
  .gate-box p{color:var(--text-muted); line-height:1.5; margin-bottom:22px;}
  #pw-form{display:flex; flex-direction:column; gap:10px;}
  #pw-input{background:var(--bg-panel); border:1px solid var(--line); color:var(--text); font-family:'Work Sans', sans-serif; font-size:1rem; padding:12px 14px; text-align:center;}
  #pw-input:focus{border-color:var(--brass);}
  #pw-error{color:var(--bad); font-size:0.85rem; min-height:1.2em;}
  #pw-submit{background:var(--brass); color:#1b140f; border:none; font-family:'Work Sans', sans-serif; font-weight:600; font-size:1rem; padding:12px; cursor:pointer; transition:background .2s;}
  #pw-submit:hover{background:var(--brass-bright);}

  /* ---------- APP (hub) ---------- */
  #app{display:none;}
  main{max-width:780px; margin:0 auto; padding:60px 24px;}
  .hub-intro{text-align:center; margin-bottom:36px;}
  .hub-intro h1{font-size:2rem; margin-bottom:10px;}
  .hub-intro p{color:var(--text-muted); line-height:1.5;}
  .hub-intro a{font-size:0.85rem; display:inline-block; margin-top:10px;}

  .hub-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px;}
  .hub-card{
    display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--text); text-decoration:none;
    padding:32px 20px; cursor:pointer; transition:border-color .15s, transform .12s ease-out, background .15s;
  }
  .hub-card:hover{border-color:var(--brass); background:var(--bg-panel-2);}
  .hub-card:active{transform:scale(0.98);}
  .hub-card .icon{font-size:2.6rem; line-height:1;}
  .hub-card .name{font-family:'Fraunces', serif; font-weight:600; font-size:1.15rem;}
  .hub-card .desc{font-size:0.82rem; color:var(--text-muted);}

  /* Espacio reservado con el mismo look para futuras secciones (aparece cuando se agreguen). */
  .hub-card.coming-soon{opacity:0.45; cursor:not-allowed;}

  @media (prefers-reduced-motion: reduce){
    #pw-submit, .hub-card{transition-property: background-color, border-color, color;}
  }
</style>
</head>
<body>

<!-- ===== PASSWORD GATE ===== -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-mark"></div>
    <h1>Entrenamiento</h1>
    <p>Ejercicios y lecciones de ajedrez.<br>Introduce la contraseña para entrar.</p>
    <form id="pw-form">
      <label for="pw-input" class="sr-only">Contraseña</label>
      <input type="password" id="pw-input" placeholder="Contraseña" autocomplete="current-password" autofocus>
      <div id="pw-error" role="alert"></div>
      <button type="submit" id="pw-submit">Entrar</button>
    </form>
  </div>
</div>

<!-- ===== MAIN APP (hub) ===== -->
<div id="app">
  <main>
    <div class="hub-intro">
      <h1>Entrenamiento 🏋️</h1>
      <p>Elige qué quieres practicar hoy.</p>
      <a href="../clases.html">← Panel de Clases</a>
    </div>
    <div class="hub-grid">
      <a href="4x4.html" class="hub-card">
        <span class="icon" aria-hidden="true">🧩</span>
        <span class="name">4×4</span>
        <span class="desc">Ejercicios tácticos por nivel</span>
      </a>
      <a href="aprender.html" class="hub-card">
        <span class="icon" aria-hidden="true">🎓</span>
        <span class="name">Aprender</span>
        <span class="desc">Lecciones interactivas paso a paso</span>
      </a>
      <a href="coordenadas.html" class="hub-card">
        <span class="icon" aria-hidden="true">🎯</span>
        <span class="name">Coordenadas</span>
        <span class="desc">Reconoce las casillas a toda velocidad</span>
      </a>
    </div>
  </main>
</div>

<script>
/* ---------------- PASSWORD GATE ----------------
   Misma contraseña y misma clave de sessionStorage que entreno/4x4.html y
   entreno/aprender.html: desbloquear una desbloquea las tres en esta pestaña.
*/
const PW_HASH = "03ece971d7c332feeb7171ea3f30c16e96fc7e0f2610b334c64b16f99407cab0";

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

const gate = document.getElementById('gate');
const app = document.getElementById('app');
const pwForm = document.getElementById('pw-form');
const pwInput = document.getElementById('pw-input');
const pwError = document.getElementById('pw-error');

function unlock(){
  gate.style.display = 'none';
  app.style.display = 'block';
  sessionStorage.setItem('entreno_unlocked','1');
}

pwForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const hash = await sha256(pwInput.value.trim());
  if(hash === PW_HASH){
    unlock();
  } else {
    pwError.textContent = 'Contraseña incorrecta.';
    pwInput.value = '';
    pwInput.focus();
  }
});

if(sessionStorage.getItem('entreno_unlocked') === '1'){
  unlock();
}
</script>
</body>
</html>
