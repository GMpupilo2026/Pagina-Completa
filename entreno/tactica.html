<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../img/favicon.svg">
<title>Táctica — ahora en Ejercicios por tema — Ajedrez Integral</title>
<meta name="description" content="Los 148 ejercicios de táctica ahora viven dentro de Ejercicios por tema.">
<!-- noindex y SIN canonical: todo /entreno/ está fuera de los buscadores, y una
     página con noindex no lleva canonical (verificar-metadatos.py lo exige, y
     con razón: sería decirle a Google cuál vale de algo que no se indexa). -->
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/tailwind.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../css/styles.css">
<script>
    (function () {
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        } catch (e) {}
    })();
</script>
<script src="../js/adaptive-mode.js"></script>
<!-- app: inicio --><meta name="theme-color" content="#102a43"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ajedrez"><script src="../js/pwa.js" defer></script><!-- app: fin --><!-- tema: inicio --><script>(function(){try{var t=localStorage.getItem('plataforma_tema_v1');if(!t||!/^[a-z]{2,24}$/.test(t)||t==='clasico')return;document.documentElement.setAttribute('data-tema',t);var b=getComputedStyle(document.documentElement).getPropertyValue('--c-brand-800').trim();var m=document.querySelector('meta[name="theme-color"]');if(b&&m)m.setAttribute('content','rgb('+b.replace(/\s+/g,',')+')');var f=localStorage.getItem('plataforma_tema_fuente_v1');if(!f||!/^[A-Za-z0-9 ]{2,32}$/.test(f))return;var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+f.replace(/ /g,'+')+':wght@400;500;600;700&display=swap';document.head.appendChild(l);}catch(e){}})();</script><!-- tema: fin --></head>
<body class="font-sans bg-brand-50 text-brand-800 dark:bg-brand-950 dark:text-brand-100">
<!--
  Esta página YA NO es un entrenador: sus 148 ejercicios viven dentro de
  "Ejercicios por tema" (entreno/temas.html), como el grupo "Táctica de ataque".

  Por qué se movieron: eran dos páginas resolviendo lo mismo, cada una con su
  tablero, su racha y su propia lista de resueltos. Con las dos abiertas, el
  mismo ejercicio se podía resolver dos veces y contaba dos veces.

  Por qué queda este archivo en vez de borrarse: la dirección está en el
  historial y en los favoritos de quien la usaba, y un 404 no le dice a nadie
  a dónde ir. Manda a temas.html sola, con un aviso por si el traslado tarda o
  el JavaScript no corre.
-->
<main id="main-content" class="min-h-[calc(100vh-5rem)] flex items-center justify-center px-4">
    <div class="w-full max-w-md text-center">
        <p class="text-5xl mb-4" aria-hidden="true">🗂️</p>
        <h1 class="font-serif text-2xl font-bold text-brand-800 dark:text-white mb-2">La táctica se mudó</h1>
        <p class="text-brand-500 dark:text-brand-300 mb-1">Los 148 ejercicios de táctica ahora están dentro de <strong>Ejercicios por tema</strong>, en el grupo «Táctica de ataque».</p>
        <p class="text-sm text-brand-450 dark:text-brand-350 mb-6">Lo que llevabas resuelto se conserva.</p>
        <a href="temas.html" class="inline-block bg-accent-500 hover:bg-accent-600 text-brand-900 font-semibold px-5 py-2.5 rounded-lg text-sm transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent-400">Ir a Ejercicios por tema →</a>
    </div>
</main>
<script>
    // Sola, pero con `replace` para no dejar esta página en el historial: quien
    // le dé "atrás" tiene que volver a donde venía, no rebotar de nuevo acá.
    window.location.replace('temas.html');
</script>
</body>
</html>
