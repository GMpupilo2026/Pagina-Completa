# Las Edge Functions se despliegan solas desde GitHub.
#
# Al entrar a main un cambio en supabase/functions/, se despliegan en Supabase
# (proyecto AjedrezIntegral) las funciones que cambiaron: las de las carpetas
# tocadas y las que llevan un archivo de _compartido/ que cambió. Antes se
# desplegaban a mano, una por una, y lo que estaba en main no siempre era lo
# que corría: centroamericano-mesas-vivo corrió días con código de una rama que
# nunca se mergeó. Ahora main ES lo que corre.
#
# Cómo se arma cada una lo decide herramientas/funciones-desplegar.js (la misma
# lista de herramientas/funciones-armar.js), y si va con verify_jwt en true o
# en false lo dice supabase/esquema/funciones-desplegadas.txt: una función que
# no esté anotada ahí no se despliega (falla), porque equivocarse en eso deja
# una función abierta o rechazando a quien la llama, sin ningún error.
#
# Necesita el secreto del repositorio SUPABASE_ACCESS_TOKEN (una clave de
# acceso personal de supabase.com/dashboard/account/tokens). Sin él, el flujo
# falla y lo dice. «Run workflow» (a mano) despliega las que se nombren.
#
# Ver «Las Edge Functions se despliegan solas desde GitHub» en
# docs/decisiones/sitio-e-infraestructura.md.
name: Funciones

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
    inputs:
      funciones:
        description: "Las funciones a desplegar, separadas por comas (ej. centroamericano-clave,arbitro-cuentas)"
        required: true
        type: string

permissions:
  contents: read

# Nunca dos despliegues a la vez, y el que viene espera al que corre.
concurrency:
  group: funciones
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar las Edge Functions
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}  # ver «El CI en una máquina propia»
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROYECTO: bgtijpimpcokxatxxbki
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: La clave de Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions). Sin él no se despliega nada."
            exit 1
          fi

      - name: Qué se despliega
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
          PEDIDAS: ${{ inputs.funciones }}
        run: |
          mkdir -p "$RUNNER_TEMP/armado/supabase"
          printf 'project_id = "ajedrez-integral"\n' > "$RUNNER_TEMP/armado/supabase/config.toml"
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            node herramientas/funciones-desplegar.js --funciones "$PEDIDAS" --salida "$RUNNER_TEMP/armado" > "$RUNNER_TEMP/plan.txt"
          else
            # Un push sin «antes» (una rama nueva) se compara con su commit anterior.
            if ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then ANTES=$(git rev-parse "$DESPUES~1"); fi
            node herramientas/funciones-desplegar.js --cambios "$ANTES" "$DESPUES" --salida "$RUNNER_TEMP/armado" > "$RUNNER_TEMP/plan.txt"
          fi
          echo "Se despliega (función y verify_jwt):"
          cat "$RUNNER_TEMP/plan.txt"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Desplegar
        run: |
          cd "$RUNNER_TEMP/armado"
          while read -r nombre jwt; do
            [ -n "$nombre" ] || continue
            extra=""
            if [ "$jwt" = "false" ]; then extra="--no-verify-jwt"; fi
            echo "::group::$nombre (verify_jwt $jwt)"
            supabase functions deploy "$nombre" --workdir "$RUNNER_TEMP/armado" --project-ref "$PROYECTO" --use-api $extra
            echo "::endgroup::"
          done < "$RUNNER_TEMP/plan.txt"
