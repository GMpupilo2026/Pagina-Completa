# Corre las comprobaciones de herramientas/ en cada PR contra main.
#
# Son más de setenta, y hasta ahora solo corrían si alguien se acordaba de
# correr la que tocaba. Un verificador que no corre no da ningún error: la
# página rota se mergea igual. Ver «El CI» en CLAUDE.md.
#
# Desde el 6/11/2026 el repositorio es privado y cada minuto se paga: del 1 al
# 5 de noviembre se gastaron 30 919 (unos 185 dólares, cuando todavía era
# público y no se cobraba). Por eso:
#   · no corre al entrar a main: el PR ya probó el código junto con main, y
#     repetirlo era la mitad del gasto;
#   · no corre en un PR en borrador: corre al marcarlo listo
#     (ready_for_review) y en cada push de ahí en adelante;
#   · las cuatro tandas con navegador esperan a la rápida: si esa falla, no
#     arrancan (unos 120 minutos que se iban en algo que igual se repite).
# A mano (workflow_dispatch, lo que piden los flujos de datos) corre siempre.
name: Verificar

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapido:
    name: Sin navegador
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install pypdf cryptography python-docx
      - run: node herramientas/verificar-todo.js --sin-navegador --paralelo=2

  navegador:
    name: Con navegador (${{ matrix.parte }}/4)
    needs: rapido
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install pypdf cryptography python-docx
      - run: npx playwright install --with-deps chromium
      # Muchos verificadores traen de respaldo la ruta del Chromium de las
      # sesiones de Claude Code (/opt/pw-browsers/…), que acá no existe; todos
      # leen CHROME_PATH primero.
      - run: echo "CHROME_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - run: node herramientas/verificar-todo.js --solo-navegador --parte=${{ matrix.parte }}/4
