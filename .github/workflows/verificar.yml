# Corre las comprobaciones de herramientas/ en cada PR contra main.
#
# Son más de setenta, y hasta ahora solo corrían si alguien se acordaba de
# correr la que tocaba. Un verificador que no corre no da ningún error: la
# página rota se mergea igual. Ver «El CI» en CLAUDE.md.
#
# Desde el 6/11/2026 el repositorio es privado y cada minuto se paga: del 1 al
# 5 de noviembre se gastaron 30 919 (unos 185 dólares, cuando todavía era
# público y no se cobraba). Por eso:
#   · no corre al entrar a main: el PR ya probó el código junto con main, y
#     repetirlo era la mitad del gasto;
#   · no corre en un PR en borrador: corre al marcarlo listo
#     (ready_for_review) y en cada push de ahí en adelante;
#   · las cuatro tandas con navegador esperan a la rápida: si esa falla, no
#     arrancan (unos 120 minutos que se iban en algo que igual se repite).
# A mano (workflow_dispatch, lo que piden los flujos de datos) corre siempre.
#
# Y para no pagar minutos: si la variable del repositorio RUNNER vale
# «self-hosted» (Settings → Secrets and variables → Actions → Variables),
# todo corre en la máquina propia del dueño, donde GitHub no cobra. Sin la
# variable, o borrándola si esa máquina se apaga por días, vuelve a las de
# GitHub sin tocar este archivo. En la máquina propia hay un solo runner: las
# cuatro tandas irían una tras otra, cada una repitiendo npm ci, Chromium y el
# arranque del sitio (unos 70 minutos). Ahí corre UNA sola, con los
# verificadores de a cuatro a la vez. Ver «El CI en una máquina propia» en
# docs/decisiones/sitio-e-infraestructura.md.
#
# Un PR que solo cambia docs/ o un .md de la raíz (CLAUDE.md, RESTAURAR.md…)
# no corre las tandas con navegador: ninguna lee esos archivos, y la rápida sí
# corre (verificar-alumno-sin-correo.js lee CLAUDE.md).
name: Verificar

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapido:
    name: Sin navegador
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # 40 y no 20: con las máquinas de 2 núcleos de un repositorio privado tarda
    # más del doble que con las de 4 (unos 12 minutos), y a los 20 se cortaba.
    timeout-minutes: 40
    outputs:
      sitio: ${{ steps.sitio.outputs.toca }}
    steps:
      - uses: actions/checkout@v7
      # Lo que cambió el PR contra main: el checkout de un PR es el commit de
      # la unión, y comparar su árbol con el de main no necesita historia.
      - name: ¿El cambio toca el sitio?
        id: sitio
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENTO" != pull_request ]; then echo "toca=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin "$BASE_SHA"
          git diff --name-only FETCH_HEAD HEAD
          if git diff --name-only FETCH_HEAD HEAD | grep -qvE '^(docs/|[^/]+\.md$)'; then toca=si; else toca=no; fi
          echo "toca=$toca" >> "$GITHUB_OUTPUT"
          [ "$toca" = si ] || echo "::notice::Solo cambia docs/ o un .md de la raíz: no corren las tandas con navegador."
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install pypdf cryptography python-docx
      # En una máquina propia, un sitio que ya esté corriendo en el 8777 (el
      # de la carpeta de trabajo del dueño) lo usarían los verificadores en
      # vez de esta copia, y probarían otro código sin dar ningún error.
      - name: ¿El puerto 8777 está libre?
        if: runner.environment == 'self-hosted'
        run: |
          node -e 'require("net").connect(8777,"127.0.0.1").on("connect",()=>{console.error("::error::Hay algo escuchando en el 8777 de esta máquina: apágalo, o los verificadores probarían ese sitio y no este PR.");process.exit(1)}).on("error",()=>process.exit(0))'
      - run: node herramientas/verificar-todo.js --sin-navegador --paralelo=2

  navegador:
    name: Con navegador (${{ matrix.parte }})
    needs: rapido
    if: needs.rapido.outputs.sitio == 'si'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # En la máquina propia la tanda es una sola y lleva todo: más margen.
    timeout-minutes: ${{ vars.RUNNER == 'self-hosted' && 75 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        parte: ${{ fromJSON(vars.RUNNER == 'self-hosted' && '["1/1"]' || '["1/4","2/4","3/4","4/4"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install pypdf cryptography python-docx
      # --with-deps instala las librerías del sistema con sudo apt: en las
      # máquinas de GitHub hace falta; en la propia se instalan una vez a mano
      # (ver «El CI en una máquina propia») y sin sudo no se pide cada vez.
      - run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      # Muchos verificadores traen de respaldo la ruta del Chromium de las
      # sesiones de Claude Code (/opt/pw-browsers/…), que acá no existe; todos
      # leen CHROME_PATH primero.
      - run: echo "CHROME_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      # En una máquina propia, un sitio que ya esté corriendo en el 8777 (el
      # de la carpeta de trabajo del dueño) lo usarían los verificadores en
      # vez de esta copia, y probarían otro código sin dar ningún error.
      - name: ¿El puerto 8777 está libre?
        if: runner.environment == 'self-hosted'
        run: |
          node -e 'require("net").connect(8777,"127.0.0.1").on("connect",()=>{console.error("::error::Hay algo escuchando en el 8777 de esta máquina: apágalo, o los verificadores probarían ese sitio y no este PR.");process.exit(1)}).on("error",()=>process.exit(0))'
      - run: node herramientas/verificar-todo.js --solo-navegador --parte=${{ matrix.parte }} --paralelo=${{ vars.RUNNER == 'self-hosted' && 4 || 1 }}
