name: Buscar Elo Nacional menores de 20 (temporal)
# TEMPORAL: se borra antes de mergear este PR. Ver herramientas/_tmp_buscar_elo_nacional.py.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python3 herramientas/_tmp_buscar_elo_nacional.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add herramientas/jdn-proyeccion/_tmp-elo-nacional-menores.csv
          git commit -m "Resultado temporal: Elo Nacional, activos menores de 20 (se borra antes de mergear)"
          git push origin HEAD:${{ github.ref_name }}
