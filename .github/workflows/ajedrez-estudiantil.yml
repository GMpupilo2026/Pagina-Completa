# Pone al día ajedrez-estudiantil.html con lo que se publica en chess-results.
#
# Cada seis horas revisa los 250 torneos de Costa Rica tocados más
# recientemente en chess-results (herramientas/ajedrez-estudiantil-actualizar.py):
# suma los de los juegos estudiantiles que sean nuevos y pone al día los
# inscritos de los que ya estaban. Después lee la clasificación de los torneos
# nuevos o que cambiaron (herramientas/ajedrez-estudiantil-jugadores.py), para
# historial-jugador.html y estadisticas-colegios.html. Si cambió algo:
#
#   1. abre un PR desde una rama datos/ajedrez-estudiantil-…;
#   2. corre «Verificar» sobre esa rama (un PR abierto con el GITHUB_TOKEN no
#      dispara otros flujos solo, así que se lo pide a mano);
#   3. si todo pasa, lo mergea (squash). Si algo falla, el PR queda abierto
#      con el CI en rojo y este flujo no abre otro hasta que se cierre.
#
# Necesita que el repositorio deje a GitHub Actions crear PR (Settings →
# Actions → General → «Allow GitHub Actions to create and approve pull
# requests»). Ver «Ajedrez estudiantil en Costa Rica: los torneos de
# chess-results» en docs/decisiones/juegos-y-torneos.md.
name: Ajedrez estudiantil

on:
  schedule:
    - cron: "41 */6 * * *"   # cada seis horas, a los 41 minutos (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ajedrez-estudiantil
  cancel-in-progress: false

jobs:
  actualizar:
    name: Revisar chess-results
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: ¿Quedó un PR de datos sin mergear?
        id: pendiente
        run: |
          n=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("datos/ajedrez-estudiantil-"))] | length')
          echo "abiertos=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" != "0" ]; then echo "::warning::Hay un PR de datos de ajedrez estudiantil abierto: se espera a que se cierre."; fi

      - name: Revisar chess-results
        if: steps.pendiente.outputs.abiertos == '0'
        run: python3 herramientas/ajedrez-estudiantil-actualizar.py --resumen "$RUNNER_TEMP/resumen.md"

      - name: Leer los jugadores de los torneos nuevos o que cambiaron
        if: steps.pendiente.outputs.abiertos == '0'
        run: python3 herramientas/ajedrez-estudiantil-jugadores.py --maximo 100 --resumen "$RUNNER_TEMP/resumen.md"

      - name: Probar las reglas con lo nuevo
        if: steps.pendiente.outputs.abiertos == '0'
        run: python3 herramientas/verificar-ajedrez-estudiantil-reglas.py

      - name: Abrir el PR, verificar y mergear
        if: steps.pendiente.outputs.abiertos == '0'
        run: |
          if git diff --quiet; then echo "Nada nuevo en chess-results."; exit 0; fi
          rama="datos/ajedrez-estudiantil-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$rama"
          git add herramientas/datos/ajedrez-estudiantil-torneos.csv herramientas/datos/ajedrez-estudiantil-actualizado.txt data/ajedrez-estudiantil.json \
            herramientas/datos/ajedrez-estudiantil-jugadores.csv herramientas/datos/ajedrez-estudiantil-equipos.csv \
            herramientas/datos/ajedrez-estudiantil-leidos.csv data/ajedrez-estudiantil-jugadores.json
          git commit -q -m "Ajedrez estudiantil: lo nuevo de chess-results" -m "$(cat "$RUNNER_TEMP/resumen.md")"
          git push -q -u origin "$rama"
          titulo="Ajedrez estudiantil: lo nuevo de chess-results ($(date -u +%Y-%m-%d))"
          gh pr create --base main --head "$rama" --title "$titulo" --body-file "$RUNNER_TEMP/resumen.md"
          gh workflow run verificar.yml --ref "$rama"
          id=""
          for i in $(seq 1 30); do
            sleep 10
            id=$(gh run list --workflow verificar.yml --branch "$rama" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
          done
          if [ -z "$id" ]; then echo "::error::No arrancó «Verificar» sobre $rama."; exit 1; fi
          gh run watch "$id" --exit-status --interval 30
          gh pr merge "$rama" --squash --delete-branch
