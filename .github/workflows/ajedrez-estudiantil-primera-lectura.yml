# TEMPORAL (segunda vuelta: los torneos sin jugadores): la primera lectura de los jugadores de todos los torneos de
# ajedrez-estudiantil.html, en la rama de trabajo. Se borra antes de mergear.
name: Ajedrez estudiantil (primera lectura de jugadores)

on:
  push:
    branches: [ccr-0b14fbbe-wzalir]
    paths: [.github/workflows/ajedrez-estudiantil-primera-lectura.yml]

permissions:
  contents: write

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Leer los jugadores
        run: python3 herramientas/ajedrez-estudiantil-jugadores.py --maximo 5000 --resumen "$RUNNER_TEMP/resumen.md"
      - name: Guardar
        if: always()
        run: |
          cat "$RUNNER_TEMP/resumen.md" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herramientas/datos/ajedrez-estudiantil-jugadores.csv herramientas/datos/ajedrez-estudiantil-equipos.csv herramientas/datos/ajedrez-estudiantil-leidos.csv data/ || true
          git commit -q -m "Ajedrez estudiantil: primera lectura de los jugadores" || exit 0
          git push -q origin HEAD:ccr-0b14fbbe-wzalir
